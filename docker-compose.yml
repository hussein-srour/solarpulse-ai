services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SOLARPULSE_ENVIRONMENT: development
      SOLARPULSE_HOST: 0.0.0.0
      SOLARPULSE_PORT: "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://localhost:8000/health", timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
