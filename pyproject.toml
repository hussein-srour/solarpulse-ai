[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "solarpulse-ai"
version = "0.1.0"
description = "Solar PV energy forecasting and underperformance detection platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Hussein Srour" },
]
keywords = ["solar-energy", "forecasting", "anomaly-detection", "fastapi"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.116,<1.0",
  "httpx>=0.27,<1.0",
  "joblib>=1.4,<2.0",
  "matplotlib>=3.9,<4.0",
  "pandas>=2.2,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "scikit-learn>=1.7,<2.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2.0",
  "pandas-stubs>=2.2,<3.0",
  "pre-commit>=4.2,<5.0",
  "pytest>=8.4,<10.0",
  "pytest-cov>=6.2,<8.0",
  "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/solarpulse_ai"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "ANN",
  "B",
  "D",
  "E",
  "F",
  "I",
  "N",
  "SIM",
  "UP",
]
ignore = [
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
pretty = true
show_error_codes = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "uvicorn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["joblib.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=solarpulse_ai",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
testpaths = ["tests"]
